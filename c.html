<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>LCR Crimson Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: black broadcast canvas, brushed-silver type, one red for live/primary.
   Diagonal slash motif from the LCR logotype cuts heroes, eyebrows and crests. */
:root{
  color-scheme:dark;
  --canvas:#0B0B0C; --panel:#141416; --raised:#1D1D20; --line:#2A2A2F; --line-2:#3A3A41;
  --fg:#E6E8EC; --muted:#9A9FA8; --faint:#6C717A;
  --silver:linear-gradient(135deg,#F2F2F2 0%,#B9BDC4 48%,#8A9098 100%);
  --silver-solid:#C8CCD3;
  --red:#E10600; --red-deep:#9E0400; --red-ink:#FFFFFF;
  --win:#E6E8EC; --loss:#6C717A;
  --t-iron:#5D5A55; --t-bronze:#8D603A; --t-silver:#A4ABB6; --t-gold:#C89B3C; --t-plat:#3AABA0; --t-dia:#5D68D6; --t-master:#9A48FF; --t-gm:#D13639; --t-chal:#F0E6D2;
  --display:'Anton','Oswald','Impact','Arial Narrow',sans-serif;
  --body:'Manrope','Helvetica Neue',Arial,sans-serif;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px));
  --gutter-r:max(16px, env(safe-area-inset-right, 0px));
}
*{box-sizing:border-box}
html{scroll-behavior:auto;scroll-padding-top:100vh}
body{margin:0;background:var(--canvas);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--canvas);z-index:60}
img,svg{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:400;text-wrap:balance}
.num,.score,td,.lp,.stat b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- type ---------- */
.disp{font-family:var(--display);text-transform:uppercase;line-height:.9;letter-spacing:-.01em}
.silver-text{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before{content:"";width:14px;height:10px;background:var(--red);transform:skewX(-12deg)}
.eyebrow.sil::before{background:var(--silver)}
.h2{display:flex;align-items:center;gap:12px;font-size:28px}
.h2::before{content:"";width:6px;height:26px;background:var(--red);transform:skewX(-12deg)}
.h2.sil::before{background:var(--silver)}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.link{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);position:relative;padding-bottom:2px}
.link::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--fg);transition:width .25s}
.link:hover{color:var(--fg)}.link:hover::after{width:100%}

/* ---------- shell ---------- */
.page{padding-left:var(--gutter-l);padding-right:var(--gutter-r);padding-block:0 48px}
.wrap{max-width:1360px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,11,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:22px;height:60px}
.brand{display:flex;align-items:center;gap:12px;flex:none}
.brand .mono{font-family:var(--display);font-size:30px;line-height:1;transform:skewX(-12deg);display:inline-block;background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.04em}
.brand .wm{display:flex;flex-direction:column;line-height:1.1}
.brand .wm b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800}
.brand .wm span{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);font-weight:600}
nav.main{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.main::-webkit-scrollbar{display:none}
nav.main a{position:relative;display:inline-flex;align-items:center;height:60px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
nav.main a:hover{color:var(--fg)}
nav.main a.inert{color:var(--faint);cursor:not-allowed}
nav.main a.active{color:var(--fg)}
nav.main a.active::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;background:var(--red);transform:skewX(-12deg)}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--fg);transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:hover{border-color:var(--fg);background:var(--raised)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.primary:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.silver{background:var(--silver);border-color:transparent;color:#0B0B0C}
.btn.silver:hover{filter:brightness(1.08)}
.btn.sm{height:32px;padding:0 12px;font-size:11px}
.btn svg{width:14px;height:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid var(--line-2);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel)}
.chip.on{color:var(--fg);border-color:var(--fg)}
.chip svg{width:12px;height:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.pill.live{background:var(--red);color:var(--red-ink);transform:skewX(-12deg)}
.pill.live>*{transform:skewX(12deg)}
.pill.live i{width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.4s ease-in-out infinite}
.pill.done{border:1px solid var(--line-2);color:var(--muted)}
.pill.up{border:1px solid var(--silver-solid);color:var(--fg)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.crest{flex:none}
.slash{display:inline-block;transform:skewX(-12deg)}
.panel{background:var(--panel);border:1px solid var(--line)}
section.screen{padding-block:0}
.block{padding-block:40px;border-bottom:1px solid var(--line)}
.block:last-of-type{border-bottom:0}

/* ---------- hero ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:560px;border-bottom:1px solid var(--line);overflow:hidden}
.hero .art{position:relative;min-height:320px}
.hero .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% 20%;clip-path:polygon(14% 0,100% 0,100% 100%,0 100%);filter:saturate(.9)}
.hero .art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--canvas) 0%,rgba(11,11,12,.55) 22%,rgba(11,11,12,0) 60%),linear-gradient(0deg,var(--canvas) 0%,rgba(11,11,12,0) 45%)}
.hero .art::before{content:"";position:absolute;top:0;bottom:0;left:14%;width:2px;background:var(--silver);transform:skewX(-12deg);transform-origin:bottom;z-index:2;opacity:.6}
.hero .copy{display:flex;flex-direction:column;justify-content:center;gap:22px;padding-block:52px;padding-right:32px;position:relative;z-index:2}
.hero .ev{display:flex;align-items:center;gap:12px}
.hero .ev img{width:40px;height:40px;object-fit:contain;background:#fff;padding:2px}
.hero .ev .eyebrow{color:var(--fg)}
.hero .title{font-size:clamp(64px,10vw,150px)}
.hero .title small{display:block;font-size:.34em;color:var(--muted);letter-spacing:.02em;margin-top:6px}
.vsrow{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.vsrow .tm{display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:34px;text-transform:uppercase;line-height:1}
.vsrow .tm span{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--muted);display:block;margin-top:4px}
.vsrow .sc{font-family:var(--display);font-size:64px;line-height:1;display:flex;align-items:center;gap:14px}
.vsrow .sc em{font-style:normal;color:var(--faint);font-size:.6em}
.hero .live-line{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);font-weight:600}
.hero .live-line b{color:var(--fg);font-weight:800}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .next{position:absolute;right:0;bottom:0;z-index:3;display:flex;align-items:center;gap:18px;padding:14px 22px;background:var(--panel);border:1px solid var(--line);border-right:0;border-bottom:0}
.hero .next .lab{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hero .next .big{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1}
.hero .next .big b{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:400}

/* ---------- match rows ---------- */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:120px minmax(0,1fr) 92px minmax(0,1fr) 220px;align-items:center;gap:12px;min-height:66px;padding:10px 16px;background:var(--panel);border:1px solid var(--line);transition:border-color .15s,background .15s;position:relative}
.mrow:hover{border-color:var(--line-2);background:var(--raised)}
.mrow.live{border-left:3px solid var(--red)}
.mtime{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:16px}
.mtime .clock{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.mteam{display:flex;align-items:center;gap:10px;min-width:0;font-weight:700;font-size:14px}
.mteam.a{justify-content:flex-end;text-align:right}
.mteam .txt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.mteam .txt b{font-size:16px;letter-spacing:.04em}
.mteam .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:600}
.mteam.win .nm{color:var(--win)}
.mrow.done .mteam:not(.win) .nm{color:var(--loss)}
.mrow.upcoming .mteam .nm{color:var(--fg)}
.score{display:flex;justify-content:center;align-items:center;gap:8px;font-family:var(--display);font-size:28px;line-height:1}
.score b{font-weight:400;color:var(--loss)}.score b.w{color:var(--win)}
.mrow.live .score b{color:var(--fg)}
.score i{font-style:normal;color:var(--faint);font-size:.7em}
.vs{text-align:center;font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--faint);text-transform:uppercase}
.mmeta{display:flex;align-items:center;justify-content:flex-end;gap:10px;font-size:12px;color:var(--muted);font-weight:600;text-align:right;min-width:0}
.mmeta span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mmeta .bo{flex:none;border:1px solid var(--line-2);padding:1px 6px;font-size:10px;letter-spacing:.1em;font-weight:800}
.spoilers .mrow.done .score b{filter:blur(7px)}
.spoilers .mrow.done .mteam .nm{color:var(--fg)}

/* ---------- home blocks ---------- */
.today-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{position:relative;padding:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:border-color .15s}
.tcard:hover{border-color:var(--line-2)}
.tcard.live{border-left:3px solid var(--red)}
.tcard .row1{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.tcard .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.tcard .teams .t{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:24px;text-transform:uppercase}
.tcard .teams .t.r{justify-content:flex-end}
.tcard .teams .c{font-family:var(--display);font-size:30px;line-height:1;text-align:center}
.tcard .teams .c small{font-family:var(--body);font-size:10px;letter-spacing:.2em;font-weight:800;color:var(--faint)}
.tcard .stage{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:36px;align-items:start}
.std{width:100%;border-collapse:collapse}
.std th{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:800}
.std td{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap}
.std tr:hover td{background:var(--raised)}
.std td.r,.std th.r{text-align:right}
.std .rk{font-family:var(--display);font-size:18px;color:var(--muted);width:40px}
.std .tn{display:flex;align-items:center;gap:10px;font-weight:800}
.std .tn small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.std tr.q td:first-child{box-shadow:inset 3px 0 0 var(--silver-solid)}
.std tr.e td{color:var(--muted)}
.std tr.e td:first-child{box-shadow:inset 3px 0 0 var(--line-2)}
.form{display:inline-flex;gap:3px}
.form i{width:9px;height:9px;transform:skewX(-12deg);background:var(--line-2)}
.form i.w{background:var(--silver-solid)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:600;margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;transform:skewX(-12deg);margin-right:6px;vertical-align:middle}
.ev-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ecard{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--panel);border:1px solid var(--line);min-height:190px;overflow:hidden;transition:border-color .15s}
.ecard:hover{border-color:var(--silver-solid)}
.ecard img{width:64px;height:64px;object-fit:contain}
.ecard .nm{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1}
.ecard .dt{font-size:12px;color:var(--muted);font-weight:600}
.ecard .pill{align-self:flex-start;margin-top:auto}
.news-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ncard{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;background:var(--panel);border:1px solid var(--line)}
.ncard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ncard:hover img{transform:scale(1.04)}
.ncard::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,11,12,.95) 0%,rgba(11,11,12,.4) 50%,rgba(11,11,12,0) 100%)}
.ncard .txt{position:absolute;left:0;right:0;bottom:0;padding:16px;z-index:2;display:flex;flex-direction:column;gap:8px}
.ncard .kind{font-size:10px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.ncard h3{font-family:var(--display);font-size:22px;text-transform:uppercase;line-height:1}
.ncard .date{font-size:11px;color:var(--muted);font-weight:600}
.sponsors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.sp{display:flex;align-items:center;justify-content:center;min-height:96px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-size:22px;text-transform:uppercase;color:var(--muted);letter-spacing:.02em;transition:color .15s,border-color .15s}
.sp:hover{color:var(--fg);border-color:var(--line-2)}
.sp.disc{background:var(--silver);color:#0B0B0C;border:0;gap:12px;font-family:var(--body);font-size:13px;font-weight:800;letter-spacing:.14em}
.sp.disc svg{width:22px;height:22px}
footer.ft{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center;padding-block:28px 0;color:var(--muted);font-size:12px;font-weight:600}
footer.ft .links{display:flex;gap:18px;flex-wrap:wrap}
footer.ft a:hover{color:var(--fg)}

/* ---------- schedule hub ---------- */
.hub{display:grid;grid-template-columns:240px minmax(0,1fr) 300px;gap:14px;padding-block:18px 0;align-items:start}
.rail{background:var(--panel);border:1px solid var(--line)}
.rail h4{padding:14px 16px 8px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}
.evl{display:flex;flex-direction:column}
.evl a{display:flex;gap:10px;align-items:center;padding:10px 16px;border-left:3px solid transparent;color:var(--muted)}
.evl a img{width:30px;height:30px;object-fit:contain;flex:none}
.evl a b{display:block;font-size:13px;color:var(--fg);font-weight:800;line-height:1.2}
.evl a small{font-size:11px;font-weight:600}
.evl a.on{border-left-color:var(--red);background:var(--raised)}
.evl a:hover{background:var(--raised)}
.evl a .pill{margin-left:auto;flex:none}
.evl a>span:not(.pill){min-width:0}
.hubbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:14px 16px;background:var(--panel);border:1px solid var(--line);margin-bottom:10px}
.hubbar .disp{font-size:28px}
.hubbar .ctrls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.day{position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:baseline;gap:10px;padding:10px 4px;background:var(--canvas);font-family:var(--display);font-size:20px;text-transform:uppercase}
.day small{font-family:var(--body);font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:700;text-transform:uppercase}
.daygroup{margin-bottom:14px}
.pr{display:flex;flex-direction:column}
.pr a{display:grid;grid-template-columns:28px 32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 16px;border-top:1px solid var(--line);font-weight:700}
.pr a:hover{background:var(--raised)}
.pr .rk{font-family:var(--display);font-size:18px;color:var(--muted)}
.pr .rec{font-size:12px;color:var(--muted);font-weight:700}
.nl a{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.nl a:hover{background:var(--raised)}
.nl img{width:56px;height:56px;object-fit:cover}
.nl b{display:block;font-size:13px;font-weight:800;line-height:1.3}
.nl small{font-size:11px;color:var(--muted);font-weight:600}

/* ---------- event hub ---------- */
.ehero{position:relative;min-height:300px;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.ehero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.ehero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,11,12,.96) 0%,rgba(11,11,12,.75) 45%,rgba(11,11,12,.2) 100%),linear-gradient(0deg,var(--canvas) 0%,rgba(11,11,12,0) 60%)}
.ehero .in{position:relative;z-index:2;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap;padding-block:48px 28px;width:100%}
.ehero .logo{width:120px;height:120px;background:#fff;padding:6px;flex:none;clip-path:polygon(12% 0,100% 0,88% 100%,0 100%)}
.ehero .logo img{width:100%;height:100%;object-fit:contain}
.ehero .meta{display:flex;flex-direction:column;gap:12px;min-width:0;flex:1}
.ehero .meta .title{font-size:clamp(40px,6vw,76px)}
.ehero .meta .sub{font-size:14px;color:var(--muted);font-weight:600}
.facts{display:flex;gap:0;flex-wrap:wrap}
.facts div{padding:8px 18px 8px 0;margin-right:18px;border-right:1px solid var(--line-2)}
.facts div:last-child{border-right:0}
.facts small{display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:800}
.facts b{font-size:14px;font-weight:800}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{position:relative;height:50px;padding:0 18px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}

/* ===================== match row ===================== */
function matchRow(m){
  const live = m.status==="live", done = m.status==="done";
  const aWin = done && m.sa > m.sb, bWin = done && m.sb > m.sa;
  const center = (live||done)
    ? `<span class="score"><b class="${aWin?'w':''}">${m.sa}</b><i>–</i><b class="${bWin?'w':''}">${m.sb}</b></span>`
    : `<span class="vs">vs</span>`;
  const time = live
    ? `<span class="pill live"><i></i><span>Live</span></span><span class="clock">Game ${m.game} · ${m.clock}</span>`
    : `<span>${m.time}</span>`;
  return `<a class="mrow ${m.status}" href="#event" data-screen="event">
    <div class="mtime">${time}</div>
    <div class="mteam a ${aWin?'win':''}"><span class="txt"><b>${m.a}</b><span class="nm">${tname(m.a)}</span></span>${crest(m.a)}</div>
    ${center}
    <div class="mteam b ${bWin?'win':''}">${crest(m.b)}<span class="txt"><b>${m.b}</b><span class="nm">${tname(m.b)}</span></span></div>
    <div class="mmeta"><span>${m.stage}</span><span class="bo">Bo${m.bo}</span></div>
  </a>`;
}

/* ===================== standings table ===================== */
function standingsTable(limit, compact){
  const rows = standingsSorted.slice(0, limit || 99).map((t,i) => {
    const cls = i < 8 ? "q" : "e";
    const pct = Math.round(t.w/(t.w+t.l)*100);
    return `<tr class="${cls}">
      <td class="rk">${i+1}</td>
      <td><span class="tn">${crest(t.tag, 30)}<span>${t.name}${compact?"":`<small>${t.city} · ${t.country}${t.invite?" · Invite":""}</small>`}</span></span></td>
      <td class="r">${t.w}</td><td class="r">${t.l}</td>
      ${compact?"":`<td class="r">${pct}%</td>`}
      <td class="r">${formDots(t.form)}</td>
    </tr>`;
  }).join("");
  return `<table class="std"><thead><tr><th>#</th><th>Team</th><th class="r">W</th><th class="r">L</th>${compact?"":'<th class="r">Win %</th>'}<th class="r">Form</th></tr></thead><tbody>${rows}</tbody></table>`;
}

/* ===================== EVENT ===================== */
function bracketBox(m, roundName){
  const [a,sa,b,sb] = m;
  const tbd = a==="TBD";
  const live = roundName==="Upper Final";
  const decided = !tbd && sa!==sb;
  const row = (tag,s,win) => `<div class="tr ${tag==='TBD'?'tbd':''} ${win?'win':''}">${crest(tag,24)}<span class="nm">${tag==='TBD'?'TBD':tname(tag)}</span><span class="s">${tbd?'':s}</span></div>`;
  return `<div class="bm ${live?'live':''}">${live?`<span class="lv pill live"><i></i><span>Live</span></span>`:''}${row(a,sa,decided&&sa>sb)}${row(b,sb,decided&&sb>sa)}</div>`;
}
function renderBracket(){

    <div class="tstats"><div class="stat"><small>Record</small><b class="silver-text">${t.w}–${t.l}</b></div><div class="stat"><small>Form</small><b style="font-size:0;display:block;padding-top:14px">${formDots(t.form)}</b></div><div class="stat"><small>Win rate</small><b>${Math.round(t.w/(t.w+t.l)*100)}%</b></div></div>
  </div>`;
  const cards = D.roster.players.map(p => `<a class="pc" href="#"><img src="${p.art}" alt=""><span class="role">${p.role}</span>${p.captain?`<span class="cap"><span>${ICON.star}&nbsp;Captain</span></span>`:""}<div class="txt"><div class="ign">${p.ign}</div><div class="rn">${p.name}</div><div class="sig"><span>Signature <b>${p.champ}</b></span><span>KDA <b class="num">${p.kda}</b></span></div></div></a>`).join("");
  const results = D.roster.results.map(r => `<a href="#"><span class="wl ${r[0]}">${r[0]}</span><span class="sc num">${r[1]}</span>${crest(r[2],28)}<span>vs ${tname(r[2])}</span><small>${r[3]}</small></a>`).join("");
  return `${head}
  <div class="block">
    <div class="sec-head"><h2 class="disp h2">Roster</h2><span class="chip">${D.roster.players.length} players</span></div>
    <div class="roster">${cards}</div>
  </div>
  <div class="block two">
    <div><div class="sec-head"><h2 class="disp h2 sil">Recent results</h2><a class="link" href="#schedule" data-screen="schedule">All matches</a></div><div class="panel res">${results}</div></div>
    <div><div class="sec-head"><h2 class="disp h2">Playing now</h2></div><div class="mlist">${matchRow(liveMatch)}</div><p style="color:var(--muted);margin:12px 0 0;font-weight:600;font-size:12px">Winner advances to the Grand Final on Sunday 23:00 PKT.</p></div>
  </div>`;
}

/* ===================== LEADERBOARD ===================== */
function renderLeaderboard(){
  const rows = D.leaderboard.map(p => {
    const rank = p.rank<=3 ? `<span class="medal m${p.rank}"><span>${p.rank}</span></span>` : p.rank;
    const d = p.delta>0 ? `<span class="delta up">▲ ${p.delta}</span>` : p.delta<0 ? `<span class="delta dn">▼ ${Math.abs(p.delta)}</span>` : `<span class="delta eq">—</span>`;
    return `<tr>
      <td class="rank">${rank}</td>
      <td><span class="pl">${crest(p.tag,32)}<span><b>${p.ign}</b><small>${p.tag} · ${p.country}</small></span></span></td>
      <td>${p.role}</td>
      <td><span class="tier" style="color:${tierColor(p.tier)}"><i></i>${p.tier}</span></td>
      <td class="r lp">${p.lp.toLocaleString()}</td>
      <td><span class="wr"><span class="bar"><i style="width:${p.wr}%"></i></span><b>${p.wr}%</b></span></td>
      <td class="r">${p.games}</td>
      <td><span class="champs">${p.champs.map(c => `<span class="champ" ${champBg(c)} title="${c}"></span>`).join("")}</span></td>
      <td class="r">${d}</td>
    </tr>`;
  }).join("");
  return `<div class="lb-head"><div>${eyebrow("Solo queue ladder · updated 6 min ago")}<h1 class="disp title">Leaderboard</h1></div><div class="chip">${D.org.tz}</div></div>
  <div class="filters">
    <span class="chip on">South Asia</span><span class="chip">Pakistan</span>
    <span class="sep"></span>
    <span class="chip on">All roles</span><span class="chip">Top</span><span class="chip">Jungle</span><span class="chip">Mid</span><span class="chip">Bot</span><span class="chip">Support</span>
    <span class="sep"></span>
    <label class="search">${ICON.search}<input id="lb-search" type="search" placeholder="Search player or team" aria-label="Search player or team"></label>
  </div>
  <div class="tscroll"><table class="lb" style="min-width:900px"><thead><tr><th>#</th><th>Player</th><th>Role</th><th>Tier</th><th class="r">LP</th><th>Win rate</th><th class="r">Games</th><th>Top champions</th><th class="r">24h</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

/* ===================== footer + nav + routing ===================== */
function renderFooter(){
  return `<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="brand"><span class="mono" style="font-size:22px">LC</span></span><span>${D.org.name} · ${D.org.domain}</span><span class="chip">${ICON.calendar}All times ${D.org.tz}</span></div>
  <div class="links"><a href="#">Terms of Service</a><a href="#">Privacy Policy</a><a href="#">Cookie Policy</a><a href="#">Community Guidelines</a></div>`;
}
function renderNav(){
  return D.nav.map(n => NAVMAP[n]
    ? `<a href="#${NAVMAP[n]}" data-screen="${NAVMAP[n]}">${n}</a>`
    : `<a href="#" class="inert" title="Not in this mockup" aria-disabled="true">${n}</a>`).join("");
}
function show(id){
  if (!SCREENS.includes(id)) id = "home";
  SCREENS.forEach(s => { document.getElementById(s).hidden = s!==id; });
  document.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('active', a.dataset.screen===id));
  if (location.hash !== "#"+id) { try { history.replaceState(null, "", "#"+id); } catch(e) {} }
  window.scrollTo({ top:0, behavior:"auto" });
}

document.getElementById("nav").innerHTML = renderNav();
document.getElementById("home").innerHTML = renderHome();
document.getElementById("schedule").innerHTML = renderSchedule();
document.getElementById("event").innerHTML = renderEvent();
document.getElementById("team").innerHTML = renderTeam();
document.getElementById("leaderboard").innerHTML = renderLeaderboard();
document.getElementById("footer").innerHTML = renderFooter();

document.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (a && a.dataset.screen) { e.preventDefault(); show(a.dataset.screen); return; }
  if (a && a.classList.contains("inert")) { e.preventDefault(); return; }
  if (a && a.getAttribute("href") === "#") { e.preventDefault(); return; }
  const tab = e.target.closest("[data-tab]");
  if (tab) {
    const name = tab.dataset.tab;
    tab.parentElement.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-selected", b===tab));
    document.querySelectorAll("#event [data-panel]").forEach(p => { p.hidden = p.dataset.panel !== name; });
  }
  if (e.target.closest("#spoil")) {
    const list = document.getElementById("sched-list");
    const btn = document.getElementById("spoil");
    list.classList.toggle("spoilers");
    const on = list.classList.contains("spoilers");
    btn.classList.toggle("on", on);
    btn.innerHTML = ICON.eye + (on ? "Spoilers hidden" : "Spoilers shown");
  }
});
window.addEventListener("hashchange", () => show(location.hash.replace("#","")));
show(location.hash.replace("#",""));
})();
</script>

</body>
</html>
